<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="8" y="8" width="744" height="384" rx="14" fill="#fbfaf6" stroke="#ddd8c9" stroke-width="1.5"/>

  <text x="28" y="40" font-size="17" font-weight="700" fill="#2b2b2b">Blue-wire interface (bench-proven)</text>
  <text x="28" y="59" font-size="12.5" fill="#6b6b6b">The controller supplies the pull-up; this ECU does not.</text>

  <g stroke="#2b2b2b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- +5 V rail (red) into R2 -->
    <line x1="250" y1="92" x2="250" y2="100" stroke="#c0392b"/>
    <!-- R2 pull-up (vertical resistor) -->
    <polyline points="250,100 250,108 243,111 257,117 243,123 257,129 250,132 250,150"/>
    <!-- trunk down to collector tap -->
    <line x1="250" y1="150" x2="250" y2="255"/>

    <!-- blue loom wire to the ECU -->
    <line x1="250" y1="170" x2="583" y2="170" stroke="#1f5fd0" stroke-width="3"/>

    <!-- branch left to R1 and RX -->
    <line x1="250" y1="210" x2="205" y2="210"/>
    <polyline points="135,210 143,210 147,203 157,217 167,203 177,217 181,210 205,210"/>
    <line x1="135" y1="210" x2="100" y2="210"/>

    <!-- transistor Q1 (NPN low-side switch) -->
    <line x1="250" y1="255" x2="265" y2="267"/>        <!-- collector lead -->
    <line x1="265" y1="260" x2="265" y2="292" stroke-width="3"/> <!-- base bar -->
    <line x1="265" y1="276" x2="305" y2="276"/>        <!-- base lead -->
    <line x1="265" y1="285" x2="287" y2="303"/>        <!-- emitter lead -->
    <line x1="287" y1="303" x2="287" y2="340"/>        <!-- emitter to GND -->

    <!-- Rb into TX -->
    <polyline points="305,276 313,276 317,269 327,283 337,269 347,283 351,276 375,276"/>
    <line x1="375" y1="276" x2="408" y2="276"/>

    <!-- ground symbol -->
    <line x1="272" y1="340" x2="302" y2="340"/>
    <line x1="277" y1="346" x2="297" y2="346"/>
    <line x1="282" y1="352" x2="292" y2="352"/>
  </g>

  <!-- emitter arrowhead (NPN, pointing out) -->
  <polygon points="288,304 277,298 283,309" fill="#2b2b2b"/>

  <!-- junction dots -->
  <g fill="#2b2b2b">
    <circle cx="250" cy="170" r="3.2"/>
    <circle cx="250" cy="210" r="3.2"/>
    <circle cx="250" cy="255" r="3.2"/>
  </g>

  <!-- pads -->
  <circle cx="96" cy="210" r="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <circle cx="412" cy="276" r="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <circle cx="250" cy="92" r="3.6" fill="#c0392b"/>

  <!-- ECU input block -->
  <rect x="583" y="135" width="152" height="78" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="659" y="162" font-size="13" font-weight="700" fill="#2b2b2b" text-anchor="middle">ECU input</text>
  <text x="659" y="181" font-size="11.5" fill="#555" text-anchor="middle">&#8776;499 &#937; series</text>
  <text x="659" y="196" font-size="11.5" fill="#555" text-anchor="middle">weak pull-down</text>
  <text x="659" y="211" font-size="11.5" fill="#555" text-anchor="middle">clamp diode</text>

  <!-- labels -->
  <g font-size="12.5" fill="#2b2b2b">
    <text x="266" y="96" fill="#c0392b">+5 V (from ECU)</text>
    <text x="266" y="120">R2</text>
    <text x="266" y="135">2.2 k&#937;</text>
    <text x="340" y="162" fill="#1f5fd0">blue wire</text>
    <text x="170" y="198" text-anchor="middle">R1  270 &#937;</text>
    <text x="96" y="232" text-anchor="middle">RX listen</text>
    <text x="96" y="247" font-size="11" fill="#6b6b6b" text-anchor="middle">(MCU input, no pull)</text>
    <text x="232" y="272" text-anchor="end">Q1</text>
    <text x="232" y="289" font-size="11.5" text-anchor="end">2N2222A</text>
    <text x="340" y="267" text-anchor="middle">Rb</text>
    <text x="412" y="297" text-anchor="middle">TX drive</text>
  </g>

  <text x="28" y="379" font-size="12" fill="#6b6b6b">Idle &#8776; 4.08 V on a 5.05 V supply. Fit a 5 V TVS from the blue wire to ground for protection.</text>
</svg>
